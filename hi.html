<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Battle Room - The Password Guess</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game-container">
    <h1 class="neon-title">🔑 VS AI Battle</h1>
    
    <!-- Setup Stage Screen -->
    <div id="setup-screen" class="box">
        <h3>Match Parameters</h3>
        
        <div class="setting-group">
            <label for="ai-count">Opponent Bots:</label>
            <select id="ai-count">
                <option value="1">1 Bot (1v1)</option>
                <option value="2">2 Bots (1v2)</option>
                <option value="4">4 Bots (1v4)</option>
                <option value="8" selected>8 Bots (1v8)</option>
            </select>
        </div>

        <div class="setting-group">
            <label for="difficulty">AI Difficulty:</label>
            <select id="difficulty">
                <option value="easy">Easy (Random Guessing)</option>
                <option value="medium" selected>Medium (Filters Word Length)</option>
                <option value="hard">Hard (Analyzes Hints + Word Length)</option>
            </select>
        </div>

        <div class="setting-group">
            <label for="secret-password">Your Secret Password:</label>
            <input type="password" id="secret-password" placeholder="Enter password (e.g. cyber)...">
        </div>

        <button onclick="startAiGame()" style="width: 100%; margin-top: 10px;">Lock Password & Start Match</button>
        <div style="text-align: center; margin-top: 15px;">
            <a href="index.html" class="back-link">← Main Menu</a>
        </div>
    </div>

    <!-- Active Stage Screen -->
    <div id="game-play" class="hidden">
        <h3>Total Collective Guesses Left: <span id="guesses-left">5</span></h3>
        <div class="chat-box" id="chat-box"></div>
        
        <div class="input-group">
            <input type="text" id="chat-input" placeholder="Give the bots a text hint...">
            <button onclick="sendPlayerHint()">Submit Clue</button>
        </div>

        <div id="action-panel" class="hidden" style="text-align: center; margin-top: 15px;">
            <button onclick="window.location.reload()">Play Again</button>
            <a href="index.html" class="back-link" style="margin-left: 15px;">Main Menu</a>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
