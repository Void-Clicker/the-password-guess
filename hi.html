    <!-- Setup Stage Screen -->
    <div id="setup-screen" class="box">
        <h3>Match Parameters</h3>
        
        <div class="setting-group">
            <label for="game-mode">Your Role:</label>
            <select id="game-mode" onchange="toggleRoleSettings()">
                <option value="host" selected>Host (You make the password, 1v8 Bots guess)</option>
                <option value="guesser">Guesser (1v1 Bot makes it, You guess)</option>
            </select>
        </div>

        <div id="bot-count-group" class="setting-group">
            <label for="ai-count">Opponent Bots:</label>
            <select id="ai-count">
                <option value="1">1 Bot (1v1)</option>
                <option value="2">2 Bots (1v2)</option>
                <option value="4">4 Bots (1v4)</option>
                <option value="8" selected>8 Bots (1v8)</option>
            </select>
        </div>

        <div class="setting-group">
            <label for="difficulty">AI Difficulty:</label>
            <select id="difficulty">
                <option value="easy">Easy (Random Logic)</option>
                <option value="medium" selected>Medium (Filters Word Length)</option>
                <option value="hard">Hard (Analyzes Contextual Clues)</option>
            </select>
        </div>

        <div id="password-group" class="setting-group">
            <label for="secret-password">Your Secret Password:</label>
            <input type="password" id="secret-password" placeholder="Enter password (e.g. cyber)...">
        </div>

        <button onclick="startAiGame()" style="width: 100%; margin-top: 10px;">Start Match</button>
        <div style="text-align: center; margin-top: 15px;">
            <a href="index.html" class="back-link">← Main Menu</a>
        </div>
    </div>
